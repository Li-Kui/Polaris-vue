<!DOCTYPE html>
<html>

<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
  <meta name="renderer" content="webkit">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <link rel="icon" href="/favicon.ico">
  <title>%VITE_APP_TITLE%</title>
  <!--[if lt IE 11]><script>window.location.href='/html/ie.html';</script><![endif]-->
  <style>
    html,
    body,
    #app {
      height: 100%;
      margin: 0px;
      padding: 0px;
      background-color: #05060b;
    }

    #loader-wrapper {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, #0c101d 0%, #05060b 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999999;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }

    /* 🪐 极光星轨扫描环 */
    .polaris-loader-orbit {
      position: relative;
      width: 120px;
      height: 120px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 32px;
    }

    .loader-ring {
      position: absolute;
      border-radius: 50%;
      border: 1.5px solid transparent;
    }

    .loader-ring.ring-1 {
      width: 70px;
      height: 70px;
      border-color: rgba(56, 189, 248, 0.25);
      border-top-color: #38bdf8;
      animation: rotateRing 2s linear infinite;
    }

    .loader-ring.ring-2 {
      width: 95px;
      height: 95px;
      border-color: rgba(168, 85, 247, 0.25);
      border-bottom-color: #a855f7;
      animation: rotateRingCounter 2.5s linear infinite;
    }

    .loader-ring.ring-3 {
      width: 120px;
      height: 120px;
      border-color: rgba(129, 140, 248, 0.15);
      border-left-color: #818cf8;
      animation: rotateRing 3s linear infinite;
    }

    .loader-star {
      font-size: 32px;
      color: #38bdf8;
      text-shadow: 0 0 15px rgba(56, 189, 248, 0.85);
      z-index: 2;
      font-weight: bold;
      animation: starBreath 2s infinite alternate ease-in-out;
      user-select: none;
    }

    /* 🌌 品牌名称与载入提示 */
    #loader-wrapper .load_title {
      text-align: center;
      margin-bottom: 24px;
      width: 100%;
    }

    #loader-wrapper .brand-text {
      font-size: 24px;
      font-weight: 900;
      letter-spacing: 0.15em;
      background: linear-gradient(90deg, #38bdf8, #818cf8, #a855f7, #38bdf8);
      background-size: 200% auto;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 10px;
      animation: shineText 4s linear infinite;
      text-transform: uppercase;
    }

    #loader-wrapper .subtitle-text {
      font-size: 13px;
      color: rgba(255, 255, 255, 0.55);
      letter-spacing: 0.05em;
      font-weight: 500;
      animation: fadePulse 1.5s infinite alternate ease-in-out;
    }

    /* 🚀 底层微光流光进度条 */
    .progress-bar-indicator {
      width: 140px;
      height: 3px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 99px;
      overflow: hidden;
    }

    .indicator-fill {
      height: 100%;
      width: 45%;
      background: linear-gradient(90deg, #38bdf8, #818cf8, #a855f7);
      border-radius: 99px;
      animation: progressLoading 2.2s infinite ease-in-out;
    }

    /* 动画关键帧 */
    @keyframes rotateRing {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }

    @keyframes rotateRingCounter {
      from { transform: rotate(0deg); }
      to { transform: rotate(-360deg); }
    }

    @keyframes starBreath {
      0% { transform: scale(0.9) rotate(0deg); opacity: 0.75; }
      100% { transform: scale(1.15) rotate(45deg); opacity: 1; }
    }

    @keyframes shineText {
      to { background-position: 200% center; }
    }

    @keyframes fadePulse {
      0% { opacity: 0.5; }
      100% { opacity: 0.9; }
    }

    @keyframes progressLoading {
      0% { transform: translateX(-100%); }
      50% { transform: translateX(100%); }
      100% { transform: translateX(-100%); }
    }
  </style>
</head>

<body>
  <div id="app">
    <div id="loader-wrapper">
      <!-- 🪐 极光星轨扫描环 -->
      <div class="polaris-loader-orbit">
        <div class="loader-ring ring-1"></div>
        <div class="loader-ring ring-2"></div>
        <div class="loader-ring ring-3"></div>
        <span class="loader-star">✦</span>
      </div>
      <!-- 🌌 品牌名称与载入提示 -->
      <div class="load_title">
        <div class="brand-text">北辰 · Polaris</div>
        <div class="subtitle-text">正在加载系统资源，请耐心等待</div>
      </div>
      <!-- 🚀 底层微光流光进度条 -->
      <div class="progress-bar-indicator">
        <div class="indicator-fill"></div>
      </div>
    </div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
