# 项目相关配置
polaris:
    # 名称
    name: RuoYi
    # 版本
    version: 3.9.2
    # 版权年份
    copyrightYear: 2026
    # 文件路径 示例（ Windows配置D:/ruoyi/uploadPath，Linux配置 /home/ruoyi/uploadPath）
    profile: /data/uploadPath
    # 获取ip地址开关
    addressEnabled: true
    # 验证码类型 math 数字计算 char 字符验证
    captchaType: math
# 数据源配置
spring:
    datasource:
        type: com.alibaba.druid.pool.DruidDataSource
        driverClassName: com.mysql.cj.jdbc.Driver
        druid:
            # 主库数据源
            master:
                # 强制数据库会话使用东八区，保证 SQL NOW() 与应用写入时间处于同一时区
                url: jdbc:mysql://172.31.61.41:3306/ry-vue?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&connectionTimeZone=%2B08:00&forceConnectionTimeZoneToSession=true
                username: root
                password: 123456
            # 从库数据源
            slave:
                # 从数据源开关/默认关闭
                enabled: false
                url: 
                username: 
                password: 
            # 初始连接数
            initialSize: 5
            # 最小连接池数量
            minIdle: 10
            # 最大连接池数量
            maxActive: 20
            # 配置获取连接等待超时的时间
            maxWait: 60000
            # 配置连接超时时间
            connectTimeout: 30000
            # 配置网络超时时间
            socketTimeout: 60000
            # 配置间隔多久才进行一次检测，检测需要关闭的空闲连接，单位是毫秒
            timeBetweenEvictionRunsMillis: 60000
            # 配置一个连接在池中最小生存的时间，单位是毫秒
            minEvictableIdleTimeMillis: 300000
            # 配置一个连接在池中最大生存的时间，单位是毫秒
            maxEvictableIdleTimeMillis: 900000
            # 配置检测连接是否有效
            validationQuery: SELECT 1 FROM DUAL
            testWhileIdle: true
            testOnBorrow: false
            testOnReturn: false
            webStatFilter: 
                enabled: true
            statViewServlet:
                enabled: true
                # 设置白名单，不填则允许所有访问
                allow:
                url-pattern: /druid/*
                # 控制台管理用户名和密码
                login-username: ruoyi
                login-password: 123456
            filter:
                stat:
                    enabled: true
                    # 慢SQL记录
                    log-slow-sql: true
                    slow-sql-millis: 1000
                    merge-sql: true
                wall:
                    config:
                        multi-statement-allow: true
    data:
        # redis 配置
        redis:
            # 地址
            host: 172.31.61.41
            # 端口，默认为6379
            port: 6379
            # 数据库索引
            database: 0
            # 密码
            password: 123456
            # 连接超时时间
            timeout: 10s
            lettuce:
                pool:
                    # 连接池中的最小空闲连接
                    min-idle: 0
                    # 连接池中的最大空闲连接
                    max-idle: 8
                    # 连接池的最大数据库连接数
                    max-active: 8
                    # #连接池最大阻塞等待时间（使用负值表示没有限制）
                    max-wait: -1ms


#兜底的AI配置
ai:
    moderation:
        enabled: true
        seed-location: classpath:moderation/polaris-sensitive-seed-v3.json
        snapshot-poll-ms: 60000
        audit-retention-days: 90
        candidate-observation-threshold: 3
        provider:
            type: none
            access-key-id:
            access-key-secret:
            endpoint: green-cip.cn-shanghai.aliyuncs.com
            service: comment_detection_pro
            timeout-ms: 1500
            estimated-cost-per-call: 0.01
    model:
        # ── 当前启用的提供商 ────────────────────────────────────────
        # 可选值: dashscope | openai | deepseek | ollama
        provider: deepseek
        # ── API Key（dashscope / openai / deepseek 需要）────────────
        api-key: ${AI_MODEL_API_KEY:}
        # ── 模型名称 ────────────────────────────────────────────────
        # dashscope : qwen-turbo（快/便宜）| qwen-plus（均衡）| qwen-max（最强）
        # openai    : gpt-4o-mini | gpt-4o
        # deepseek  : deepseek-chat | deepseek-reasoner
        # ollama    : qwen2.5 | llama3.2 | mistral（本地运行）
        model-name: deepseek-v4-flash
        # ── Ollama 专用（本地部署时填写）────────────────────────────
        base-url:
        # ── 通用参数 ────────────────────────────────────────────────
        max-tokens: 2048
        temperature: 0.1
        max-history-messages: 20
        # ── 系统提示词（支持自定义 AI 角色与行为）───────────────────
        system-prompt: 你是一个专业、友好的 AI 助手，请用中文回答问题。
    workflow:
        max-concurrent-per-user: 3
        max-pending-approvals-per-user: 20
        lease-seconds: 90
        heartbeat-ms: 30000
        retention-days: 30
        approval-expire-days: 7
        maintenance-ms: 3600000
        enabled: true
        write-nodes-enabled: false
        code-node-enabled: false
        worker-enabled: true
        accepting-new-executions: true
        worker-batch-size: 10
        tenant-concurrency: 20
        workflow-concurrency: 10
        principal-concurrency: 5
        allowed-tenant-ids: []
        executor:
            core-pool-size: 4
            max-pool-size: 16
            queue-capacity: 100
        node-executor:
            core-pool-size: 8
            max-pool-size: 32
            queue-capacity: 100

    # RAG 向量存储配置
    vector-store:
        # memory: 启动后重建内存索引；qdrant: 使用持久化 Qdrant collection
        type: qdrant
        # auto: memory 重建、qdrant 跳过；首次迁移到 Qdrant 可临时改为 always
        rebuild-on-startup: auto
        qdrant:
            host: localhost
            # Qdrant gRPC 端口，不是 REST 端口 6333
            port: 6334
            use-tls: false
            api-key: 123456
            collection-name: polaris_knowledge
            # 必须与当前 Embedding 模型输出维度一致；text-embedding-v3 默认 1024
            dimension: 1024
            on-disk: true
            initialize-schema: true
            create-payload-indexes: true
            payload-text-key: text_segment
            timeout: 10s
