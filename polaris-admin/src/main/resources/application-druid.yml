# 数据源配置
spring:
    datasource:
        type: com.alibaba.druid.pool.DruidDataSource
        driverClassName: com.mysql.cj.jdbc.Driver
        druid:
            # 主库数据源
            master:
                url: jdbc:mysql://localhost:3306/ry-vue?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8
                username: root
                password: 123456
            # 从库数据源
            slave:
                # 从数据源开关/默认关闭
                enabled: false
                url: 
                username: 
                password: 
            # 初始连接数
            initialSize: 5
            # 最小连接池数量
            minIdle: 10
            # 最大连接池数量
            maxActive: 20
            # 配置获取连接等待超时的时间
            maxWait: 60000
            # 配置连接超时时间
            connectTimeout: 30000
            # 配置网络超时时间
            socketTimeout: 60000
            # 配置间隔多久才进行一次检测，检测需要关闭的空闲连接，单位是毫秒
            timeBetweenEvictionRunsMillis: 60000
            # 配置一个连接在池中最小生存的时间，单位是毫秒
            minEvictableIdleTimeMillis: 300000
            # 配置一个连接在池中最大生存的时间，单位是毫秒
            maxEvictableIdleTimeMillis: 900000
            # 配置检测连接是否有效
            validationQuery: SELECT 1 FROM DUAL
            testWhileIdle: true
            testOnBorrow: false
            testOnReturn: false
            webStatFilter: 
                enabled: true
            statViewServlet:
                enabled: true
                # 设置白名单，不填则允许所有访问
                allow:
                url-pattern: /druid/*
                # 控制台管理用户名和密码
                login-username: ruoyi
                login-password: 123456
            filter:
                stat:
                    enabled: true
                    # 慢SQL记录
                    log-slow-sql: true
                    slow-sql-millis: 1000
                    merge-sql: true
                wall:
                    config:
                        multi-statement-allow: true


#兜底的AI配置
ai:
    model:
        # ── 当前启用的提供商 ────────────────────────────────────────
        # 可选值: dashscope | openai | deepseek | ollama
        provider: deepseek
        # ── API Key（dashscope / openai / deepseek 需要）────────────
        api-key: sk-388e29a91e1c4fdb8f5653c6b9cf9d1d
        # ── 模型名称 ────────────────────────────────────────────────
        # dashscope : qwen-turbo（快/便宜）| qwen-plus（均衡）| qwen-max（最强）
        # openai    : gpt-4o-mini | gpt-4o
        # deepseek  : deepseek-chat | deepseek-reasoner
        # ollama    : qwen2.5 | llama3.2 | mistral（本地运行）
        model-name: deepseek-v4-flash
        # ── Ollama 专用（本地部署时填写）────────────────────────────
        base-url:
        # ── 通用参数 ────────────────────────────────────────────────
        max-tokens: 2048
        temperature: 0.1
        max-history-messages: 20
        # ── 系统提示词（支持自定义 AI 角色与行为）───────────────────
        system-prompt: 你是一个专业、友好的 AI 助手，请用中文回答问题。
